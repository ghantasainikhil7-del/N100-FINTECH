# ==============================================================================
# Nifty 100 Financial Intelligence Platform — Source-to-Table Mapping
# Deterministic Source Configuration, Column Mappings & Lineage Rules
# ==============================================================================

version: "1.0"

# Global ETL settings
settings:
  expected_sources_count: 12
  strict_validation: true
  allow_unmapped_columns_warning: true
  stop_on_missing_required: true

# Source file definitions (7 Core + 5 Supplementary)
sources:

  SRC-01:
    name: companies_primary
    description: "Core company master reference data from primary financial filing"
    pattern:
      - "*companies*.xlsx"
      - "*company*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: companies
      mode: upsert
      operation: primary
    required: true
    required_columns:
      - company_id
      - company_name
    column_mapping:
      company_id: id
      id: id
      ticker: id
      nse: id
      bse: bse_profile
      company_name: company_name
      company_logo: company_logo
      chart_link: chart_link
      about: about_company
      about_company: about_company
      website: website
      nse_profile: nse_profile
      bse_profile: bse_profile
      face_value: face_value
      book_value: book_value
      roce_%: roce_percentage
      roce_percentage: roce_percentage
      roe_%: roe_percentage
      roe_percentage: roe_percentage

  SRC-02:
    name: profitandloss
    description: "Annual Profit & Loss income statements"
    pattern:
      - "*profitandloss*.xlsx"
      - "*profit*.xlsx"
      - "*p&l*.xlsx"
      - "*pnl*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: profitandloss
      mode: replace
      operation: statement
    required: true
    required_columns:
      - company_id
      - year
      - sales
      - net_profit
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      year: year
      sales: sales
      expenses: expenses
      operating_profit: operating_profit
      opm_%: opm_percentage
      opm_percentage: opm_percentage
      other_income: other_income
      interest: interest
      depreciation: depreciation
      profit_before_tax: profit_before_tax
      tax_%: tax_percentage
      tax_percentage: tax_percentage
      net_profit: net_profit
      eps: eps
      dividend_payout_%: dividend_payout
      dividend_payout: dividend_payout

  SRC-03:
    name: balancesheet
    description: "Annual Balance Sheet statements"
    pattern:
      - "*balancesheet*.xlsx"
      - "*balance*.xlsx"
      - "*bs*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: balancesheet
      mode: replace
      operation: statement
    required: true
    required_columns:
      - company_id
      - year
      - total_assets
      - total_liabilities
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      year: year
      equity_capital: equity_capital
      reserves: reserves
      borrowings: borrowings
      other_liabilities: other_liabilities
      total_liabilities: total_liabilities
      fixed_assets: fixed_assets
      cwip: cwip
      investments: investments
      other_asset: other_asset
      other_assets: other_asset
      total_assets: total_assets

  SRC-04:
    name: cashflow
    description: "Annual Cash Flow statements"
    pattern:
      - "*cashflow*.xlsx"
      - "*cash_flow*.xlsx"
      - "*cash flow*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: cashflow
      mode: replace
      operation: statement
    required: true
    required_columns:
      - company_id
      - year
      - operating_activity
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      year: year
      cash_from_operating_activity: operating_activity
      operating_activity: operating_activity
      cash_from_investing_activity: investing_activity
      investing_activity: investing_activity
      cash_from_financing_activity: financing_activity
      financing_activity: financing_activity
      net_cash_flow: net_cash_flow

  SRC-05:
    name: analysis
    description: "Pre-computed multi-year growth rates and qualitative analysis"
    pattern:
      - "*analysis*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: analysis
      mode: replace
      operation: supplementary
    required: true
    required_columns:
      - company_id
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      compounded_sales_growth: compounded_sales_growth
      compounded_profit_growth: compounded_profit_growth
      stock_price_cagr: stock_price_cagr
      return_on_equity: roe
      roe: roe

  SRC-06:
    name: documents
    description: "Annual report filing repository links"
    pattern:
      - "*document*.xlsx"
      - "*documents*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: documents
      mode: replace
      operation: supplementary
    required: true
    required_columns:
      - company_id
      - year
      - annual_report
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      year: year
      annual_report: annual_report
      is_url_valid: is_url_valid

  SRC-07:
    name: prosandcons
    description: "Automated qualitative strengths and risks"
    pattern:
      - "*prosandcons*.xlsx"
      - "*pros*.xlsx"
      - "*cons*.xlsx"
    source_type: excel
    header_row: 1
    default_sheet: "Sheet1"
    destination:
      table: prosandcons
      mode: replace
      operation: supplementary
    required: true
    required_columns:
      - company_id
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      pros: pros
      cons: cons

  SRC-08:
    name: sectors
    description: "Official Nifty 100 constituent sector and weight classification"
    pattern:
      - "*sector*.xlsx"
      - "*sectors*.xlsx"
      - "*sector*.csv"
      - "*sectors*.csv"
    source_type: excel_or_csv
    header_row: 0
    default_sheet: "Sheet1"
    destination:
      table: sectors
      mode: upsert
      operation: reference
    required: true
    required_columns:
      - company_id
      - broad_sector
      - sub_sector
    column_mapping:
      company_id: company_id
      ticker: company_id
      id: company_id
      broad_sector: broad_sector
      sub_sector: sub_sector
      index_weight_%: index_weight_pct
      index_weight_pct: index_weight_pct
      market_cap_category: market_cap_category

  SRC-09:
    name: stock_prices
    description: "Historical OHLCV stock prices and volumes"
    pattern:
      - "*stock_price*.xlsx"
      - "*stock_prices*.xlsx"
      - "*prices*.xlsx"
      - "*stock_prices*.csv"
      - "*stock*.csv"
    source_type: excel_or_csv
    header_row: 0
    default_sheet: "Sheet1"
    destination:
      table: stock_prices
      mode: replace
      operation: market_data
    required: true
    required_columns:
      - company_id
      - date
      - close_price
    column_mapping:
      company_id: company_id
      ticker: company_id
      date: date
      open: open_price
      open_price: open_price
      high: high_price
      high_price: high_price
      low: low_price
      low_price: low_price
      close: close_price
      close_price: close_price
      volume: volume
      adj_close: adjusted_close
      adjusted_close: adjusted_close

  SRC-10:
    name: financial_ratios
    description: "Pre-computed financial ratios and KPI metrics"
    pattern:
      - "*financial_ratio*.xlsx"
      - "*financial_ratios*.xlsx"
      - "*ratios*.xlsx"
      - "*financial_ratios*.csv"
    source_type: excel_or_csv
    header_row: 0
    default_sheet: "Sheet1"
    destination:
      table: financial_ratios
      mode: replace
      operation: analytics
    required: true
    required_columns:
      - company_id
      - year
    column_mapping:
      company_id: company_id
      year: year
      net_profit_margin_pct: net_profit_margin_pct
      operating_profit_margin_pct: operating_profit_margin_pct
      return_on_equity_pct: return_on_equity_pct
      return_on_capital_employed_pct: return_on_capital_employed_pct
      return_on_assets_pct: return_on_assets_pct
      debt_to_equity: debt_to_equity
      high_leverage_flag: high_leverage_flag
      interest_coverage: interest_coverage
      icr_label: icr_label
      asset_turnover: asset_turnover
      net_debt_cr: net_debt_cr
      free_cash_flow_cr: free_cash_flow_cr
      free_cash_flow_crore: free_cash_flow_crore
      capex_cr: capex_cr
      capex_crore: capex_crore
      fcf_conversion_pct: fcf_conversion_pct
      capex_intensity_pct: capex_intensity_pct
      earnings_per_share: earnings_per_share
      book_value_per_share: book_value_per_share
      dividend_payout_ratio_pct: dividend_payout_ratio_pct
      total_debt_cr: total_debt_cr
      total_debt_crore: total_debt_crore
      cash_from_operations_cr: cash_from_operations_cr
      cash_from_operations_crore: cash_from_operations_crore
      revenue_cagr_5yr: revenue_cagr_5yr
      revenue_cagr_5yr_flag: revenue_cagr_5yr_flag
      pat_cagr_5yr: pat_cagr_5yr
      pat_cagr_5yr_flag: pat_cagr_5yr_flag
      eps_cagr_5yr: eps_cagr_5yr
      eps_cagr_5yr_flag: eps_cagr_5yr_flag
      composite_quality_score: composite_quality_score

  SRC-11:
    name: peer_groups
    description: "Industry peer group clusters and benchmark indicators"
    pattern:
      - "*peer_group*.xlsx"
      - "*peer_groups*.xlsx"
      - "*peers*.xlsx"
      - "*peer_groups*.csv"
    source_type: excel_or_csv
    header_row: 0
    default_sheet: "Sheet1"
    destination:
      table: peer_groups
      mode: replace
      operation: reference
    required: true
    required_columns:
      - peer_group_name
      - company_id
    column_mapping:
      peer_group_name: peer_group_name
      company_id: company_id
      ticker: company_id
      is_benchmark: is_benchmark

  SRC-12:
    name: company_enrichment
    description: "Additional company master/reference attributes used strictly for enrichment"
    pattern:
      - "*company_master*.csv"
      - "*company_master*.xlsx"
      - "*company_enrichment*.csv"
      - "*company_enrichment*.xlsx"
      - "*company_detail*.xlsx"
      - "*company_info*.xlsx"
    source_type: excel_or_csv
    header_row: 0
    default_sheet: "Sheet1"
    destination:
      table: companies
      mode: upsert
      operation: enrichment
    required: true
    business_key_priority:
      - isin
      - nse_code
      - bse_code
      - normalized_ticker
      - normalized_company_name
    source_priority:
      primary: SRC-01
      enrichment: SRC-12
      derived: default
    overwrite_primary_values: false
    required_columns:
      - company_name
    column_mapping:
      isin: isin
      isin_code: isin
      nse_symbol: nse_code
      nse_code: nse_code
      ticker: normalized_ticker
      company_id: normalized_ticker
      bse_code: bse_code
      company_name: company_name
      website: website
      about: about_company
      about_company: about_company
      company_logo: company_logo
      chart_link: chart_link
      nse_profile: nse_profile
      bse_profile: bse_profile
      market_cap_category: market_cap_category
