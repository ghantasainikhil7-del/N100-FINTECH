# Nifty 100 Investment Screener Presets & Configuration (Sprint 3)
# Analyst-editable thresholds and scoring weights

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, conservative leverage, positive free cash flow, sustained growth"
    roe_min: 15.0
    de_max: 1.0
    fcf_min: 0.0
    revenue_cagr_5yr_min: 10.0
    rank_by: "composite_quality_score"
    sort_order: "desc"

  value_pick:
    name: "Value Pick"
    description: "Low P/E, moderate P/B, manageable debt, positive dividend yield"
    pe_max: 20.0
    pb_max: 3.0
    de_max: 2.0
    dividend_yield_min: 1.0
    rank_by: "composite_quality_score"
    sort_order: "desc"

  growth_accelerator:
    name: "Growth Accelerator"
    description: "Fast-growing PAT and revenue over 5-year period with prudent leverage"
    pat_cagr_5yr_min: 20.0
    revenue_cagr_5yr_min: 15.0
    de_max: 2.0
    rank_by: "composite_quality_score"
    sort_order: "desc"

  dividend_champion:
    name: "Dividend Champion"
    description: "Substantial dividend yield, sustainable payout ratio, positive FCF"
    dividend_yield_min: 2.0
    dividend_payout_max: 80.0
    fcf_min: 0.0
    rank_by: "dividend_yield_pct"
    sort_order: "desc"

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt, healthy ROE, and large-scale revenues (> ₹5,000 Cr)"
    de_max: 0.0
    roe_min: 12.0
    sales_min: 5000.0
    rank_by: "composite_quality_score"
    sort_order: "desc"

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Improving 3Y revenue CAGR, positive latest FCF, decreasing leverage YoY"
    revenue_cagr_3yr_min: 10.0
    fcf_positive_latest: true
    de_declining_yoy: true
    rank_by: "composite_quality_score"
    sort_order: "desc"

# Scoring weights for 0-100 Composite Quality Score
scoring_weights:
  profitability:
    total: 0.35
    roe: 0.15
    roce: 0.10
    npm: 0.10
  cash_quality:
    total: 0.30
    fcf: 0.15
    cfo_pat_ratio: 0.10
    fcf_positive_flag: 0.05
  growth:
    total: 0.20
    revenue_cagr: 0.10
    pat_cagr: 0.10
  leverage:
    total: 0.15
    de_score: 0.10
    icr_score: 0.05

# Supported 15 filterable metrics definition
filterable_metrics:
  - id: roe_min
    alias: min_roe
    column: return_on_equity_pct
    type: min
    name: "Return on Equity Min (%)"
  - id: de_max
    alias: max_de
    column: debt_to_equity
    type: max
    exempt_sector: Financials
    name: "Debt to Equity Max"
  - id: fcf_min
    alias: min_fcf
    column: free_cash_flow_cr
    type: min
    name: "Free Cash Flow Min (₹ Cr)"
  - id: revenue_cagr_5yr_min
    alias: min_rev_cagr_5yr
    column: revenue_cagr_5yr
    type: min
    name: "5Y Revenue CAGR Min (%)"
  - id: pat_cagr_5yr_min
    alias: min_pat_cagr_5yr
    column: pat_cagr_5yr
    type: min
    name: "5Y PAT CAGR Min (%)"
  - id: opm_min
    alias: min_opm
    column: operating_profit_margin_pct
    type: min
    name: "Operating Profit Margin Min (%)"
  - id: pe_max
    alias: max_pe
    column: pe_ratio
    type: max
    name: "P/E Ratio Max"
  - id: pb_max
    alias: max_pb
    column: pb_ratio
    type: max
    name: "P/B Ratio Max"
  - id: dividend_yield_min
    alias: min_dividend_yield
    column: dividend_yield_pct
    type: min
    name: "Dividend Yield Min (%)"
  - id: icr_min
    alias: min_icr
    column: interest_coverage
    type: min
    debt_free_passes: true
    name: "Interest Coverage Min"
  - id: market_cap_min
    alias: min_market_cap
    column: market_cap_crore
    type: min
    name: "Market Cap Min (₹ Cr)"
  - id: net_profit_min
    alias: min_net_profit
    column: net_profit
    type: min
    name: "Net Profit Min (₹ Cr)"
  - id: eps_cagr_min
    alias: min_eps_cagr
    column: eps_cagr_5yr
    type: min
    name: "5Y EPS CAGR Min (%)"
  - id: asset_turnover_min
    alias: min_asset_turnover
    column: asset_turnover
    type: min
    name: "Asset Turnover Min"
  - id: sales_min
    alias: min_sales
    column: sales
    type: min
    name: "Sales Min (₹ Cr)"
